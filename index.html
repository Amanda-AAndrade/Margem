<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="Um espaço tranquilo para escrever. Seus textos ficam salvos no seu dispositivo, mesmo offline.">
  <link rel="manifest" href="manifest.json">
  <title>Margem — espaço de escrita</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap');
    :root{--bg:#f8f7f4;--panel:#fff;--ink:#252923;--muted:#83877e;--line:#e9e8e2;--accent:#58765e;--accent-light:#e9f0e8;--paper:#fffefa;--shadow:0 10px 32px #353a2910;--serif:'Source Serif 4',Georgia,serif;--sans:'DM Sans',sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);height:100vh;overflow:hidden}button,input{font:inherit}button{color:inherit;cursor:pointer}
    .app{height:100%;display:grid;grid-template-columns:264px 1fr;grid-template-rows:64px 1fr}
    header{grid-column:1/3;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);z-index:2}
    .brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-.04em;font-size:18px}.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:white}.brand-mark svg{width:17px}.top-actions{display:flex;align-items:center;gap:12px}.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#72a477}.icon-btn{width:36px;height:36px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:#686d64}.icon-btn:hover{background:#eeede8}.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    aside{border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;min-height:0}.new-btn{height:42px;border:0;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;box-shadow:0 3px 8px #58765e22}.new-btn:hover{background:#49684f}.new-btn svg{width:17px;stroke:currentColor;fill:none;stroke-width:2}.section-label{font-size:10px;color:#9a9d95;letter-spacing:.13em;text-transform:uppercase;font-weight:700;margin:31px 10px 11px}.nav{display:grid;gap:4px}.nav-item{border:0;background:none;text-align:left;padding:10px 11px;border-radius:8px;color:#70756d;display:flex;align-items:center;gap:11px;font-size:13px}.nav-item.active{background:#ebece5;color:#394d3d;font-weight:600}.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.doc-list{overflow:auto;display:grid;gap:3px}.doc-row{border:0;background:none;text-align:left;padding:10px 11px;border-radius:8px;display:flex;align-items:flex-start;gap:10px}.doc-row:hover,.doc-row.selected{background:#efeee9}.doc-row .file{width:15px;color:#9b9d94;flex:none;margin-top:1px}.doc-row strong{font-size:12px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:175px}.doc-row small{font-size:10px;color:#a0a198;display:block;margin-top:4px}.side-bottom{margin-top:auto;padding:18px 8px 2px;color:#a3a49d;font-size:11px;line-height:1.7}.side-bottom strong{color:#777d73;font-weight:500}
    main{min-width:0;overflow:auto;position:relative}.welcome{max-width:1050px;margin:0 auto;padding:58px 56px 36px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}.welcome h1{font:48px/1.12 'DM Serif Display',Georgia,serif;letter-spacing:-.035em;margin:13px 0 9px}.welcome .intro{color:#84877f;font:16px var(--serif);margin:0}.quickstart{margin-top:36px;display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:14px}.quick-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:19px;min-height:125px;text-align:left;transition:.18s;box-shadow:0 2px 5px #25292304}.quick-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d7ddd3}.quick-icon{height:32px;width:32px;display:grid;place-items:center;border-radius:9px;background:var(--accent-light);color:var(--accent);margin-bottom:12px}.quick-icon svg{width:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.quick-card strong{font-size:13px}.quick-card p{font-size:11px;color:#92958d;margin:6px 0 0;line-height:1.45}.recent-head{display:flex;justify-content:space-between;align-items:center;margin:39px 0 12px}.recent-head h2{font-size:13px;margin:0;font-weight:600}.recent-head span{color:#9c9f97;font-size:11px}.recent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.recent-card{height:136px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:17px;text-align:left;position:relative;overflow:hidden}.recent-card:after{content:'';position:absolute;left:17px;right:17px;top:57px;height:36px;background:repeating-linear-gradient(to bottom,transparent 0 10px,#f0efe9 10px 11px)}.recent-card strong{font:16px var(--serif);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.recent-card small{font-size:10px;color:#999d94;display:block;margin-top:8px}.recent-card:hover{border-color:#cfd8ce;box-shadow:var(--shadow)}.empty{color:#a0a198;font:13px var(--serif);padding:28px 4px}
    .editor-shell{height:100%;display:flex;flex-direction:column}.editor-top{height:58px;display:flex;align-items:center;padding:0 30px;border-bottom:1px solid var(--line);gap:18px;background:#fbfaf8}.back{border:0;background:none;color:#777d73;display:flex;align-items:center;gap:7px;font-size:12px}.back svg{width:16px;stroke:currentColor;fill:none;stroke-width:1.8}.title-input{border:0;outline:0;background:transparent;font-size:14px;font-weight:600;width:min(390px,40vw);color:var(--ink)}.editor-status{margin-left:auto;color:#9a9d95;font-size:11px}.editor-tools{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;background:#fbfaf8}.tool{height:30px;min-width:32px;border:0;background:transparent;border-radius:5px;color:#646a61;font-family:var(--serif);font-size:15px}.tool:hover{background:#eeede8}.tool.bold{font-family:var(--sans);font-weight:700}.tool.italic{font-style:italic}.tool.underline{text-decoration:underline}.divider{height:19px;width:1px;background:var(--line);margin:0 7px}.editor-area{overflow:auto;flex:1;padding:38px 18px 70px}.paper{width:min(760px,100%);min-height:940px;margin:0 auto;background:var(--paper);box-shadow:0 2px 16px #2529230a;border:1px solid #eeede8;padding:82px 94px 110px}.paper [contenteditable]{outline:0;min-height:700px;color:#31342f;font:18px/1.85 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere}.paper [contenteditable]:empty:before{content:attr(data-placeholder);color:#b8b9b2}.paper [contenteditable] h1{font:36px/1.2 'DM Serif Display',Georgia,serif;margin:0 0 22px}.paper [contenteditable] p{margin:0 0 1em}.word-count{position:fixed;bottom:20px;right:28px;background:#f8f7f4ee;border:1px solid var(--line);border-radius:20px;padding:7px 13px;color:#898d83;font-size:10px;box-shadow:0 2px 8px #00000008}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;background:#30382f;color:white;padding:11px 16px;border-radius:9px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:58px 1fr}header{grid-column:1}.app aside{display:none}.welcome{padding:38px 22px}.welcome h1{font-size:39px}.quickstart{grid-template-columns:1fr 1fr;gap:9px}.quick-card:first-child{grid-column:1/3}.recent-grid{grid-template-columns:1fr 1fr}.editor-top{padding:0 12px;gap:9px}.editor-status{display:none}.editor-area{padding:14px 7px 50px}.paper{padding:48px 25px;min-height:800px}.paper [contenteditable]{font-size:17px}.editor-tools{justify-content:flex-start;padding-left:9px;overflow:auto}.sync{font-size:0}.word-count{bottom:10px;right:10px}}
  </style>
</head>
<body>
<div class="app" id="app">
  <header><div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v18H7.5A2.5 2.5 0 0 1 5 17.5z"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15H20M9 6h7M9 9h7"/></svg></div>margem</div><div class="top-actions"><div class="sync"><span class="dot"></span><span id="networkLabel">Salvo neste dispositivo</span></div><button class="icon-btn" id="exportAll" title="Exportar textos" aria-label="Exportar textos"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg></button></div></header>
  <aside><button class="new-btn" id="newDoc"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo documento</button><div class="section-label">Biblioteca</div><nav class="nav"><button class="nav-item active" data-view="all"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H20v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M4 17.5A1.5 1.5 0 0 1 5.5 16H20"/></svg>Todos os textos</button><button class="nav-item" data-view="recent"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Recentes</button><button class="nav-item" data-view="favorites"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg>Favoritos</button></nav><div class="section-label">Seus documentos</div><div class="doc-list" id="docList"></div><div class="side-bottom">Um lugar calmo para as palavras.<br><strong>Seus textos ficam com você.</strong></div></aside>
  <main id="main"></main>
</div><div class="toast" id="toast"></div>
<script>
(()=>{
 const KEY='margem-documents-v1';let docs=JSON.parse(localStorage.getItem(KEY)||'[]'),current=null,view='all',saveTimer;
 const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function persist(){localStorage.setItem(KEY,JSON.stringify(docs));renderList()}
 function dateLabel(t){return new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'short'}).format(new Date(t)).replace('.','')}
 function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
 function renderList(){const list=$('#docList');let rows=[...docs].sort((a,b)=>b.updated-a).filter(d=>view==='favorites'?d.favorite:view==='recent'?Date.now()-d.updated<7*864e5:true);list.innerHTML=rows.map(d=>`<button class="doc-row ${d.id===current?'selected':''}" data-id="${d.id}"><svg class="file" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 2.5h8l4 4v11H4zM12 2.5v4h4M7 10h6M7 13h6"/></svg><span><strong>${esc(d.title||'Sem título')}</strong><small>${dateLabel(d.updated)}</small></span></button>`).join('')||'<div class="empty" style="padding:8px 10px">Nenhum texto por aqui ainda.</div>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openDoc(b.dataset.id))}
 function card(d){return `<button class="recent-card" data-open="${d.id}"><strong>${esc(d.title||'Sem título')}</strong><small>Editado ${dateLabel(d.updated)} · ${d.words||0} palavras</small></button>`}
 function home(){current=null;renderList();const main=$('#main'),sorted=[...docs].sort((a,b)=>b.updated-a.updated);main.innerHTML=`<div class="welcome"><div class="eyebrow">Seu espaço de escrita</div><h1>Deixe as palavras<br>encontrarem a margem.</h1><p class="intro">Um lugar tranquilo para começar, continuar e guardar suas histórias.</p><div class="quickstart"><button class="quick-card" id="quickNew"><span class="quick-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><strong>Começar a escrever</strong><p>Uma página em branco e espaço para pensar.</p></button><button class="quick-card" id="quickJournal"><span class="quick-icon"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg></span><strong>Diário de hoje</strong><p>Registre o que está passando pela cabeça.</p></button><button class="quick-card" id="quickIdea"><span class="quick-icon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M8.2 14.5A6 6 0 1 1 15.8 14.5c-.9.7-1.3 1.5-1.3 2.5h-5c0-1-.4-1.8-1.3-2.5z"/></svg></span><strong>Capturar uma ideia</strong><p>Guarde aquele começo antes que escape.</p></button></div><div class="recent-head"><h2>Seus textos</h2><span>${docs.length?docs.length+' documento'+(docs.length===1?'':'s'):'Sua biblioteca está pronta'}</span></div>${sorted.length?`<div class="recent-grid">${sorted.slice(0,6).map(card).join('')}</div>`:'<div class="empty">Seus documentos vão aparecer aqui. Comece quando quiser.'}</div></div>`;
 $('#quickNew').onclick=()=>createDoc();$('#quickJournal').onclick=()=>createDoc('Diário · '+new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'long'}).format(new Date()),'Hoje,\n\n');$('#quickIdea').onclick=()=>createDoc('Uma ideia','A ideia começa assim…\n\n');main.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDoc(b.dataset.open))}
 function createDoc(title='Sem título',content=''){const d={id:crypto.randomUUID(),title,content,updated:Date.now(),words:0,favorite:false};docs.push(d);persist();openDoc(d.id);setTimeout(()=>$('#writing')?.focus(),30)}
 function openDoc(id){current=id;const d=docs.find(x=>x.id===id);if(!d)return;renderList();$('#main').innerHTML=`<div class="editor-shell"><div class="editor-top"><button class="back" id="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6M9 12h11"/></svg>Biblioteca</button><input class="title-input" id="docTitle" value="${esc(d.title)}" aria-label="Título do documento"><button class="icon-btn" id="favorite" title="${d.favorite?'Remover dos favoritos':'Adicionar aos favoritos'}" aria-label="Favorito"><svg viewBox="0 0 24 24" style="${d.favorite?'fill:#7c8c60;stroke:#7c8c60':''}"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg></button><span class="editor-status" id="saveStatus">Salvo neste dispositivo</span><button class="icon-btn" id="exportDoc" title="Baixar como texto" aria-label="Baixar como texto"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg></button></div><div class="editor-tools"><button class="tool bold" data-cmd="bold">B</button><button class="tool italic" data-cmd="italic">I</button><button class="tool underline" data-cmd="underline">U</button><span class="divider"></span><button class="tool" data-cmd="formatBlock" data-val="p">¶</button><button class="tool" data-cmd="formatBlock" data-val="h1">H1</button><span class="divider"></span><button class="tool" data-cmd="insertUnorderedList">☷</button><button class="tool" data-cmd="insertOrderedList">1.</button><span class="divider"></span><button class="tool" id="clearFormat" title="Limpar formatação">Tx</button></div><div class="editor-area"><div class="paper"><div id="writing" contenteditable="true" spellcheck="true" data-placeholder="Comece a escrever..."></div></div></div><div class="word-count" id="wordCount">0 palavras</div></div>`;
 const editor=$('#writing');editor.innerHTML=d.content||'';$('#docTitle').oninput=e=>{d.title=e.target.value;touch();renderList()};editor.oninput=()=>{d.content=editor.innerHTML;d.words=countWords(editor.innerText);touch();$('#wordCount').textContent=d.words+' palavra'+(d.words===1?'':'s')};$('#wordCount').textContent=(d.words||0)+' palavra'+(d.words===1?'':'s');$('#back').onclick=home;$('#favorite').onclick=()=>{d.favorite=!d.favorite;persist();openDoc(id)};$('#exportDoc').onclick=()=>download(d);document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{editor.focus();document.execCommand(b.dataset.cmd,false,b.dataset.val||null);editor.dispatchEvent(new Event('input'))});$('#clearFormat').onclick=()=>{editor.focus();document.execCommand('removeFormat');editor.dispatchEvent(new Event('input'))};
 }
 function countWords(s){return s.trim()?s.trim().split(/\s+/).length:0}function touch(){const d=docs.find(x=>x.id===current);if(!d)return;d.updated=Date.now();$('#saveStatus').textContent='Salvando…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{persist();$('#saveStatus').textContent='Salvo neste dispositivo'},350)}
 function download(d){const text=(d.title+'\n\n'+($('#writing')?.innerText||d.content.replace(/<[^>]+>/g,' '))).trim();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=(d.title||'texto').replace(/[\\/:*?"<>|]/g,'-')+'.txt';a.click();URL.revokeObjectURL(a.href)}
 $('#newDoc').onclick=()=>createDoc();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===b));renderList()});$('#exportAll').onclick=()=>{const blob=new Blob([JSON.stringify(docs,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='margem-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup baixado')};window.addEventListener('online',()=>$('#networkLabel').textContent='Salvo neste dispositivo');window.addEventListener('offline',()=>$('#networkLabel').textContent='Offline · tudo salvo aqui');home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
